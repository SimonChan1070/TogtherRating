    <div class="section-head">
      <h2 id="all-title">All ratings</h2>
      <div class="feed-tools">
        <button class="chip" id="btn-toggle-all" type="button">Collapse all</button>
        <button class="chip" id="btn-refresh" type="button">Refresh</button>
      </div>
    </div>
    <div class="summary" id="summary" hidden>
      <div class="tile"><b id="sum-n">0</b><span>ratings</span></div>
      <div class="tile"><b id="sum-avg">–</b><span>avg score</span></div>
      <div class="tile"><b id="sum-good">–</b><span>👍 good</span></div>
    </div>

  </div>

  <div class="view" id="rate-view">
  <div class="install" id="install" hidden>
    <img src="icons/icon-192.png" alt="">
    <div class="t"><b>Install as an app</b><span id="install-how"></span></div>
    <button class="btn primary" id="install-btn" hidden>Install</button>
    <button class="x" id="install-x" aria-label="Dismiss">×</button>

  <div class="meals" id="meals" role="tablist" aria-label="Meal"></div>

  <section>
    <div class="section-head">
      <h2 id="menu-title">Menu</h2>
      <span class="theme" id="theme" hidden></span>
    </div>
    <div class="dishes" id="dishes" style="margin-top:8px"></div>
  </section>

  <section class="sheet" id="sheet" hidden>
    <div class="picked">
      <span class="k">Rating 評分</span>
      <span class="zh" id="p-zh"></span>
      <span class="en" id="p-en"></span>
    </div>

    <div class="others" id="others" hidden></div>

    <label class="f">Verdict 好唔好食
      <div class="verdict">
        <button type="button" class="v good" id="v-good" aria-pressed="false"><span class="emo">👍</span>Good<small>好食</small></button>
        <button type="button" class="v bad" id="v-bad" aria-pressed="false"><span class="emo">👎</span>Not Good<small>唔好食</small></button>
      </div>

    <label class="f" for="score">Score 分數 (0–100)
      <div class="score">
        <input type="range" id="score" min="0" max="100" step="1" value="70">
        <div class="big"><span id="score-out">70</span><small>/100</small></div>
      </div>
      <div class="presets" id="presets"></div>

    <label class="f" for="comment">Comment 意見
      <textarea class="input" id="comment" placeholder="e.g. soup was great, chicken a bit dry…"></textarea>
    </label>

    <label class="f" for="name">Your name 姓名 <span class="opt">(optional · not shown to others)</span>
      <input class="input" id="name" placeholder="Optional" autocomplete="name">
    </label>

    <div class="actions">
      <button class="btn primary" id="btn-submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        Submit rating
      </button>
      <button class="btn wa" id="btn-image-one">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5.3-.5c.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
        Share to WhatsApp as image
      </button>
      <div class="note" id="submit-note"></div>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2 id="log-title">My ratings today</h2>
      <button class="chip" id="btn-clear-log" type="button">Clear</button>
    </div>
    <div class="log" id="log" style="margin-top:8px"></div>
    <div class="actions" style="margin-top:10px">
      <button class="btn wa" id="btn-image-all" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5.3-.5c.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
        Share today's ratings to WhatsApp
      </button>
    </div>
  </section>
  </div>
</main>

<nav class="tabbar" aria-label="Sections">
  <button id="tab-rate" class="on" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/><path d="M8 11h8M8 14.5h5"/></svg>
    All ratings <small class="zh">全部評價</small>

</nav>

<div class="modal img-modal" id="img-modal" hidden>
  <div class="card">
    <h2>Share as image</h2>
    <img id="img-preview" alt="Rating card">
    <div class="actions">
      <button class="btn wa" id="img-share">Share… (WhatsApp)</button>
      <a class="btn ghost" id="img-save" download="together-rating.png">Save image</a>
      <button class="btn ghost" id="img-close">Close</button>

</div>

<div class="modal" id="modal" hidden>
  <div class="card">
    <h2>Settings</h2>
    <div class="status" id="cfg-status"></div>

    <details>
      <summary class="note">Advanced: rating service URL</summary>
      <input class="input" id="cfg-api" placeholder="https://script.google.com/macros/s/…/exec" style="margin-top:8px">
    </details>

    <div class="actions">
      <button class="btn primary" id="cfg-save">Save</button>
      <button class="btn ghost" id="cfg-close">Close</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MEALS = ["Breakfast", "Lunch", "Dinner", "Supper"];
  const MEAL_ZH = { Breakfast: "早餐", Lunch: "午餐", Dinner: "晚餐", Supper: "宵夜" };
  const LOW_SCORE = 50; // average below this shows in red (matches the 👍/👎 boundary)
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // menu-data holds {"weeks":[{week, days}, ...]} oldest first (older builds shipped a single {week, days})
  const MENU_RAW = JSON.parse($("menu-data").textContent || '{"weeks":[]}');
  const WEEKS = (MENU_RAW.weeks || (MENU_RAW.days ? [MENU_RAW] : []))
    .filter(w => w && Array.isArray(w.days) && w.days.length)
    .sort((a, b) => a.days[0].date.localeCompare(b.days[0].date));
  const todayIso = new Date().toLocaleDateString("en-CA"); // yyyy-mm-dd, local time
  // default week: the one containing today; otherwise the latest week that has started (or the first if all are future)
  const thisWeekIdx = WEEKS.findIndex(w => w.days.some(d => d.date === todayIso));
  const startedIdx = WEEKS.map((w, i) => (w.days[0].date <= todayIso ? i : -1)).filter(i => i >= 0).pop();
  const state = {
    week: thisWeekIdx >= 0 ? thisWeekIdx : (startedIdx ?? 0),
    date: null,
    meal: mealByClock(),
    dish: null, verdict: null, score: 70,
    results: null, tab: "rate"
  };

  function mealByClock() {
    const h = new Date().getHours() + new Date().getMinutes() / 60;
    return h < 10.5 ? "Breakfast" : h < 15 ? "Lunch" : h < 20.5 ? "Dinner" : "Supper";
  }
  function week() { return WEEKS[state.week] || { week: "", days: [] }; }
  function days() { return week().days; }
  function day() { return days().find(d => d.date === state.date); }
  function weekStatus(w) {
    if (!w.days.length) return "";
    if (w.days.some(d => d.date === todayIso)) return "this week";
    return w.days[w.days.length - 1].date < todayIso ? "past" : "coming";
  }
  // pick a day in the current week: keep the weekday the user was on, else today, else the first day
  function pickDate(prevDate) {
    const ds = days(); if (!ds.length) return null;
    if (ds.some(d => d.date === todayIso) && !prevDate) return todayIso;
    if (prevDate) { const wd = new Date(prevDate + "T12:00:00").getDay(); const same = ds.find(d => new Date(d.date + "T12:00:00").getDay() === wd); if (same) return same.date; }
    return ds.some(d => d.date === todayIso) ? todayIso : ds[0].date;
  }
  function setWeek(i) {
    if (i < 0 || i >= WEEKS.length || i === state.week) return;
    state.week = i; state.date = pickDate(state.date); state.dish = null; state.results = null;
    renderAll(); loadResults();
  }
  state.date = pickDate(null);
  function fmtDate(iso) { const [y, m, d] = iso.split("-"); return `${+d}/${+m}`; }
  function dow(iso) { return new Date(iso + "T12:00:00").toLocaleDateString("en", { weekday: "short" }); }

  /* ---------- config ---------- */
  function config() {
    const saved = store.get("ttr_cfg", null) || {};
    return { apiUrl: saved.apiUrl || CONFIG.apiUrl };
  }
  function configReady(c) { return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(c.apiUrl || ""); }

  /* ---------- rendering ---------- */
  function renderWeek() {
    const w = week(), st = weekStatus(w);
    $("wk-text").innerHTML = `${esc(w.week || "Menu")}${st ? `<small>${st === "this week" ? "本週" : st === "past" ? "past 過去" : "next 下週"}</small>` : ""}`;
    $("wk-prev").disabled = state.week <= 0;
    $("wk-next").disabled = state.week >= WEEKS.length - 1;
    const sel = $("wk-select"); sel.innerHTML = "";
    WEEKS.forEach((x, i) => {
      const o = document.createElement("option"); o.value = i;
      const s2 = weekStatus(x); o.textContent = `${x.week}${s2 === "this week" ? " · this week" : s2 === "coming" ? " · coming" : ""}`;
      o.selected = i === state.week; sel.appendChild(o);
    });
  }
  $("wk-prev").onclick = () => setWeek(state.week - 1);
  $("wk-next").onclick = () => setWeek(state.week + 1);
  $("wk-select").onchange = (e) => setWeek(+e.target.value);

  function renderDays() {
    $("days").innerHTML = "";
    for (const d of days()) {
      const b = document.createElement("button");
      b.className = "day" + (d.date === state.date ? " on" : "") + (d.date === todayIso ? " today" : "");
      b.setAttribute("role", "tab"); b.setAttribute("aria-selected", d.date === state.date);
      b.innerHTML = `<span class="dow">${dow(d.date)}</span><span class="dom">${d.date.slice(-2).replace(/^0/, "")}</span>`;
      b.onclick = () => { state.date = d.date; state.dish = null; state.results = null; renderAll(); loadResults(); };
      $("days").appendChild(b);
    }
  }
  function renderMeals() {
    $("meals").innerHTML = "";
    for (const m of MEALS) {
      const b = document.createElement("button");
      b.className = "meal" + (m === state.meal ? " on" : "");
      b.setAttribute("role", "tab"); b.setAttribute("aria-selected", m === state.meal);
      b.innerHTML = `${m}<small class="zh">${MEAL_ZH[m]}</small>`;
      b.onclick = () => { state.meal = m; state.dish = null; renderAll(); };
      $("meals").appendChild(b);
    }
  }
  function renderDishes() {
    const d = day();
    const items = d ? (d.meals[state.meal] || []) : [];
    $("menu-title").textContent = d ? `${dow(d.date)} ${fmtDate(d.date)} · ${state.meal} ${MEAL_ZH[state.meal]}` : "Menu";
    $("theme").hidden = !(d && d.theme); $("theme").textContent = d ? d.theme : "";
    const box = $("dishes"); box.innerHTML = "";
    if (!items.length) { box.innerHTML = `<div class="empty">No menu for this meal.</div>`; return; }
    items.forEach((it, i) => {
      const b = document.createElement("button");
      const r = resultFor(it);
      b.className = "dish" + (state.dish === i ? " on" : "") + (r && r.avg < LOW_SCORE ? " low" : "");
      b.innerHTML = `<span class="zh">${esc(it.zh)}</span><span class="en">${esc(it.en)}</span>`;
      if (r) {
        b.insertAdjacentHTML("beforeend",
          `<span class="stat"><span class="g">👍 ${r.good}</span><span class="b">👎 ${r.bad}</span><span class="bar"><i style="width:${r.avg}%"></i></span><span class="n">${r.avg}/100 · ${r.n} rating${r.n === 1 ? "" : "s"}</span></span>`);
        const withText = r.rows.filter(x => x.comment);
        if (withText.length) {
          const shown = withText.slice(0, 2).map(x =>
            `<span>${x.rating === "Good" ? "👍" : "👎"} ${esc(x.comment)}</span>`).join("");
          const more = withText.length > 2 ? `<span class="more">+${withText.length - 2} more — tap to read all</span>` : "";
          b.insertAdjacentHTML("beforeend", `<span class="cmts">${shown}${more}</span>`);
        }
      }
      b.onclick = () => { state.dish = i; state.verdict = null; renderAll(); $("sheet").scrollIntoView({ behavior: "smooth", block: "start" }); };
      box.appendChild(b);
    });
  }
  function renderSheet() {
    const d = day(); const it = d && state.dish != null ? d.meals[state.meal][state.dish] : null;
    $("sheet").hidden = !it;
    if (!it) return;
    $("p-zh").textContent = it.zh; $("p-en").textContent = it.en;
    const r = resultFor(it);
    $("others").hidden = !r;
    if (r) $("others").innerHTML = `<span class="k">Everyone's ratings · ${r.n}</span>` + r.rows.map(x =>
      `<div class="row"><span>${x.rating === "Good" ? "👍" : "👎"}</span><span class="c">${x.comment ? esc(x.comment) : "<i>No comment</i>"}</span><span class="s ${x.rating === "Good" ? "g" : "b"}">${x.score}</span></div>`).join("");
    $("v-good").classList.toggle("on", state.verdict === "Good"); $("v-good").setAttribute("aria-pressed", state.verdict === "Good");
    $("v-bad").classList.toggle("on", state.verdict === "Not Good"); $("v-bad").setAttribute("aria-pressed", state.verdict === "Not Good");
    $("score").value = state.score; $("score-out").textContent = state.score;
    const c = config();
    $("submit-note").className = "note" + (configReady(c) ? "" : " warn");
    $("submit-note").textContent = configReady(c) ? "Your rating and comment will be visible to everyone." : "Not connected — the rating stays on this phone. Image sharing still works.";
  }
  function renderLog() {
    const all = store.get("ttr_log", []).filter(e => e.date === state.date);
    $("log-title").textContent = state.date === todayIso ? "My ratings today" : `My ratings · ${fmtDate(state.date)}`;
    const box = $("log"); box.innerHTML = "";
    if (!all.length) box.innerHTML = `<div class="empty">Nothing rated yet — pick a dish above.</div>`;
    for (const e of all.slice().reverse()) {
      const g = e.rating === "Good";
      box.insertAdjacentHTML("beforeend", `<div class="entry">
        <span class="emo">${g ? "👍" : "👎"}</span>
        <span class="t"><span class="zh">${esc(e.zh)}</span><span class="m">${e.meal} · ${esc(e.en)}${e.pending ? ' · <span class="pending">not sent</span>' : ""}</span>${e.comment ? `<span class="c">“${esc(e.comment)}”</span>` : ""}</span>
        <span class="s ${g ? "g" : "b"}">${e.score}<small>/100</small></span></div>`);
    }
    $("btn-image-all").hidden = !all.length;
    $("btn-clear-log").hidden = !all.length;
  }
  function renderAll() { renderWeek(); renderDays(); renderMeals(); renderDishes(); renderSheet(); renderLog(); renderFeed(); renderTabs(); }

  /* ---------- tabs ---------- */
  function renderTabs() {
    const all = state.tab === "all";
    $("rate-view").hidden = all; $("all-view").hidden = !all;
    $("tab-rate").classList.toggle("on", !all); $("tab-rate").setAttribute("aria-pressed", !all);
    $("tab-all").classList.toggle("on", all); $("tab-all").setAttribute("aria-pressed", all);
  }
  $("tab-rate").onclick = () => { state.tab = "rate"; renderTabs(); window.scrollTo({ top: 0 }); };
  $("tab-all").onclick = () => { state.tab = "all"; renderTabs(); window.scrollTo({ top: 0 }); loadResults(); };
  $("btn-refresh").onclick = () => { $("btn-refresh").textContent = "Refreshing…"; loadResults().finally(() => { $("btn-refresh").textContent = "Refresh"; }); };

  /* ---------- all-ratings feed (every rating + comment for the selected day) ---------- */
  function dishFor(food) {
    const d = day(); if (!d) return null;
    for (const meal of MEALS) for (const it of d.meals[meal] || []) if (String(food).startsWith(it.en)) return it;
    return null;
  }
  function renderFeed() {
    const d = day();
    $("all-title").textContent = d ? `All ratings · ${dow(d.date)} ${fmtDate(d.date)}` : "All ratings";
    const feed = $("feed"); feed.innerHTML = "";
    const rows = state.results;
    if (!rows) { feed.innerHTML = `<div class="empty">Loading ratings…</div>`; $("summary").hidden = true; return; }
    if (!rows.length) { feed.innerHTML = `<div class="empty">No ratings yet for this day — be the first!</div>`; $("summary").hidden = true; return; }
    const good = rows.filter(r => r.rating === "Good").length;
    $("sum-n").textContent = rows.length;
    const dayAvg = Math.round(rows.reduce((a, r) => a + (+r.score || 0), 0) / rows.length);
    $("sum-avg").textContent = dayAvg; $("sum-avg").parentElement.classList.toggle("low", dayAvg < LOW_SCORE);
    $("sum-good").textContent = Math.round(good / rows.length * 100) + "%";
    $("summary").hidden = false;
    const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>`;
    for (const meal of MEALS) {
      const inMeal = rows.filter(r => r.meal === meal);
      if (!inMeal.length) continue;
      // group by dish
      const groups = new Map();
      for (const r of inMeal) { const key = (dishFor(r.food) || {}).en || String(r.food); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(r); }
      const dishes = [...groups].map(([key, list]) => {
        const it = dishFor(list[0].food) || { en: key, zh: "" };
        const g = list.filter(r => r.rating === "Good").length;
        const avg = Math.round(list.reduce((a, r) => a + (+r.score || 0), 0) / list.length);
        const sorted = list.slice().sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
        const open = feedOpen.dish[`${meal}|${key}`] !== false;
        return `<details class="fdish${avg < LOW_SCORE ? " low" : ""}" data-key="${esc(meal + "|" + key)}"${open ? " open" : ""}>
          <summary>
            <div class="head">${CHEV}<div><div class="zh">${esc(it.zh || it.en)}</div>${it.zh ? `<div class="en">${esc(it.en)}</div>` : ""}</div><div class="avg">${avg}<small>/100</small></div></div>
            <div class="stat"><span class="g">👍 ${g}</span><span class="b">👎 ${list.length - g}</span><span class="bar"><i style="width:${avg}%"></i></span><span class="n">${list.length} rating${list.length === 1 ? "" : "s"}</span></div>
          </summary>
          <div class="others">${sorted.map(x => `<div class="row"><span>${x.rating === "Good" ? "👍" : "👎"}</span><span class="c">${x.comment ? esc(x.comment) : "<i>No comment</i>"}</span><span class="s ${x.rating === "Good" ? "g" : "b"}">${x.score}</span></div>`).join("")}</div>
        </details>`;
      }).join("");
      const mopen = feedOpen.meal[meal] !== false;
      feed.insertAdjacentHTML("beforeend", `<details class="fmeal" data-key="${meal}"${mopen ? " open" : ""}>
        <summary>${CHEV}${meal} <span class="zh">${MEAL_ZH[meal]}</span><span class="cnt">${inMeal.length}</span></summary>
        <div class="dishes-in">${dishes}</div>
      </details>`);
    }
    updateToggleLabel();
  }
  // remember what the user collapsed so a refresh doesn't undo it
  const feedOpen = { meal: {}, dish: {} };
  $("feed").addEventListener("toggle", (e) => {
    const d = e.target; if (!(d instanceof HTMLDetailsElement)) return;
    (d.classList.contains("fmeal") ? feedOpen.meal : feedOpen.dish)[d.dataset.key] = d.open;
    updateToggleLabel();
  }, true);
  function updateToggleLabel() {
    const all = [...$("feed").querySelectorAll("details")];
    $("btn-toggle-all").hidden = !all.length;
    $("btn-toggle-all").textContent = all.some(d => d.open) ? "Collapse all" : "Expand all";
  }
  $("btn-toggle-all").onclick = () => {
    const all = [...$("feed").querySelectorAll("details")];
    const open = !all.some(d => d.open);
    for (const d of all) { d.open = open; (d.classList.contains("fmeal") ? feedOpen.meal : feedOpen.dish)[d.dataset.key] = open; }
    updateToggleLabel();
  };
  function esc(s) { return String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

  /* ---------- rating form ---------- */
  $("v-good").onclick = () => { state.verdict = "Good"; if (state.score < 50) state.score = 75; renderSheet(); };
  $("v-bad").onclick = () => { state.verdict = "Not Good"; if (state.score >= 50) state.score = 35; renderSheet(); };
  $("score").oninput = (e) => { state.score = +e.target.value; $("score-out").textContent = state.score; };
  for (const p of [20, 40, 60, 80, 100]) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = p;
    b.onclick = () => { state.score = p; renderSheet(); };
    $("presets").appendChild(b);
  }
  $("name").value = store.get("ttr_name", "");
  $("name").onchange = () => store.set("ttr_name", $("name").value.trim());

  function currentEntry() {
    const d = day(); const it = d.meals[state.meal][state.dish];
    return {
      ts: new Date().toISOString(), date: d.date, weekday: dow(d.date), meal: state.meal,
      zh: it.zh, en: it.en, rating: state.verdict, score: state.score,
      comment: $("comment").value.trim(), name: $("name").value.trim()
    };
  }
  function validate() {
    if (state.dish == null) return "Pick a dish first.";
    if (!state.verdict) return "Tap 👍 Good or 👎 Not Good.";
    return null;
  }

  const SUBMIT_HTML = $("btn-submit").innerHTML;
  $("btn-submit").onclick = async () => {
    const err = validate(); if (err) return toast(err);
    const e = currentEntry(); const c = config();
    const btn = $("btn-submit"); btn.disabled = true; btn.textContent = "Sending…";
    e.pending = true;
    if (configReady(c)) e.pending = !(await postRating(c, e));
    const log = store.get("ttr_log", []); log.push(e); store.set("ttr_log", log);
    store.set("ttr_name", e.name);
    btn.disabled = false; btn.innerHTML = SUBMIT_HTML;
    toast(e.pending ? "Saved on this phone — will retry sending later." : "Rating saved — thank you! 多謝");
    $("comment").value = ""; state.verdict = null; state.score = 70; state.dish = null;
    renderAll();
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    if (!e.pending) loadResults();
  };

  // Apps Script web app: a text/plain POST needs no CORS preflight; it answers {ok:true} after a redirect.
  async function postRating(c, e) {
    try {
      const res = await fetch(c.apiUrl, {
        method: "POST", body: JSON.stringify({
          date: e.date, meal: e.meal, food: `${e.en} ${e.zh}`.trim(), rating: e.rating,
          score: e.score, comment: e.comment, name: e.name
        })
      });
      const j = await res.json();
      return !!j.ok;
    } catch (err) { console.warn("send failed", err); return false; }
  }

  // ratings that could not be sent (e.g. offline) are retried on the next visit
  async function flushPending() {
    const c = config(); if (!configReady(c)) return;
    const log = store.get("ttr_log", []); let changed = false;
    for (const e of log) if (e.pending && await postRating(c, e)) { e.pending = false; changed = true; }
    if (changed) { store.set("ttr_log", log); renderLog(); loadResults(); }
  }

  /* ---------- image card (canvas → PNG → share sheet) ---------- */
  const C = { green: "#5FA83A", deep: "#2E6B2A", lime: "#C9E56B", ink: "#1B2617", ink2: "#4F5E48", ink3: "#8A9782",
              line: "#D8E2CF", good: "#3E9E4A", bad: "#D6553F", ground: "#F4F7F0", panel: "#FFFFFF" };
  const UI = '"Nunito", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif';
  const ZH = '"Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Nunito", sans-serif';

  // wraps on spaces when it can, otherwise per character (Chinese has no spaces)
  function wrap(ctx, text, maxW) {
    const lines = []; let line = "";
    for (const ch of String(text)) {
      const test = line + ch;
      if (ctx.measureText(test).width <= maxW || !line) { line = test; continue; }
      const cut = line.lastIndexOf(" ");
      if (cut > 0 && ch !== " ") { lines.push(line.slice(0, cut)); line = line.slice(cut + 1) + ch; }
      else { lines.push(line); line = ch === " " ? "" : ch; }
    }
    if (line) lines.push(line);
    return lines;
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  async function buildCard(entries) {
    try { await document.fonts.load(`900 52px ${UI}`); await document.fonts.load(`700 44px ${ZH}`); } catch {}
    const W = 1080, PAD = 56, INNER = W - PAD * 2;
    const measure = document.createElement("canvas").getContext("2d");
    // pass 1: layout
    const blocks = entries.map(e => {
      measure.font = `500 30px ${UI}`; const en = wrap(measure, e.en, INNER - 420);
      measure.font = `700 44px ${ZH}`; const zh = wrap(measure, e.zh, INNER - 420);
      measure.font = `italic 500 30px ${UI}`; const cm = e.comment ? wrap(measure, "\u201c" + e.comment + "\u201d", INNER - 120) : [];
      const h = 40 + zh.length * 52 + en.length * 38 + (cm.length ? 12 + cm.length * 40 : 0) + 36;
      return { e, zh, en, cm, h };
    });
    const HEAD = 200, FOOT = 90;
    const H = HEAD + 40 + blocks.reduce((a, b) => a + b.h + 20, 0) + FOOT;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = C.ground; ctx.fillRect(0, 0, W, H);
    // header
    ctx.fillStyle = C.green; ctx.fillRect(0, 0, W, HEAD);
    ctx.fillStyle = C.lime; ctx.fillRect(0, HEAD - 8, W, 8);
    ctx.beginPath(); ctx.arc(PAD + 52, 100, 52, 0, Math.PI * 2); ctx.fillStyle = C.lime; ctx.fill();
    ctx.beginPath(); ctx.arc(PAD + 52, 100, 44, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.fillStyle = C.green; ctx.font = `900 50px ${ZH}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("\u805a", PAD + 52, 104);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#fff"; ctx.font = `900 54px ${UI}`; ctx.fillText("Today Together Rating", PAD + 130, 92);
    const first = entries[0];
    ctx.font = `700 34px ${UI}`; ctx.globalAlpha = .9;
    ctx.fillText(`${first.weekday} ${fmtDate(first.date)}  \u00b7  ${entries.every(x => x.meal === first.meal) ? first.meal + " " + MEAL_ZH[first.meal] : "Today's ratings"}`, PAD + 130, 146);
    ctx.globalAlpha = 1;
    // blocks
    let y = HEAD + 40;
    for (const b of blocks) {
      roundRect(ctx, PAD, y, INNER, b.h, 28); ctx.fillStyle = C.panel; ctx.fill();
      ctx.strokeStyle = C.line; ctx.lineWidth = 3; ctx.stroke();
      const good = b.e.rating === "Good";
      ctx.font = `64px ${UI}`; ctx.textBaseline = "alphabetic"; ctx.fillStyle = C.ink;
      ctx.fillText(good ? "\ud83d\udc4d" : "\ud83d\udc4e", PAD + 32, y + 92);
      let ty = y + 40 + 44;
      ctx.fillStyle = C.ink; ctx.font = `700 44px ${ZH}`;
      for (const l of b.zh) { ctx.fillText(l, PAD + 124, ty); ty += 52; }
      ctx.fillStyle = C.ink2; ctx.font = `500 30px ${UI}`;
      for (const l of b.en) { ctx.fillText(l, PAD + 124, ty - 8); ty += 38; }
      // score, right aligned
      ctx.textAlign = "right"; ctx.fillStyle = good ? C.good : C.bad; ctx.font = `900 84px ${UI}`;
      ctx.fillText(String(b.e.score), W - PAD - 100, y + 108);
      ctx.fillStyle = C.ink3; ctx.font = `800 28px ${UI}`; ctx.fillText("/100", W - PAD - 32, y + 108);
      ctx.font = `800 24px ${UI}`; ctx.fillStyle = good ? C.good : C.bad;
      ctx.fillText(good ? "GOOD \u597d\u98df" : "NOT GOOD \u5514\u597d\u98df", W - PAD - 32, y + 146);
      ctx.textAlign = "left";
      if (b.cm.length) {
        ty += 12; ctx.fillStyle = C.ink2; ctx.font = `italic 500 30px ${UI}`;
        for (const l of b.cm) { ctx.fillText(l, PAD + 40, ty); ty += 40; }
      }
      y += b.h + 20;
    }
    // footer
    ctx.fillStyle = C.ink3; ctx.font = `700 26px ${UI}`; ctx.textAlign = "center";
    ctx.fillText("\u805a\u5618 Together canteen  \u00b7  " + location.host + location.pathname.replace(/index\.html$/, ""), W / 2, H - 36);
    return cv;
  }

  let imgFile = null, imgUrl = null;
  async function openImageShare(entries) {
    toast("Drawing the card\u2026");
    const cv = await buildCard(entries);
    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    if (imgUrl) URL.revokeObjectURL(imgUrl);
    imgUrl = URL.createObjectURL(blob);
    imgFile = new File([blob], `together-rating-${entries[0].date}.png`, { type: "image/png" });
    $("img-preview").src = imgUrl;
    $("img-save").href = imgUrl; $("img-save").download = imgFile.name;
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [imgFile] }));
    $("img-share").hidden = !canShare;
    $("img-note").textContent = canShare ? "Share\u2026 opens your phone's share sheet \u2014 pick WhatsApp there." : "This browser can't share files directly: save the image, then attach it in WhatsApp.";
    $("img-modal").hidden = false;
  }
  $("img-share").onclick = () => {
    if (!imgFile) return;
    navigator.share({ files: [imgFile], title: "Today Together Rating" }).catch(err => { if (err.name !== "AbortError") toast("Share failed: " + err.message); });
  };
  $("img-close").onclick = () => { $("img-modal").hidden = true; };
  $("img-modal").onclick = (e) => { if (e.target === $("img-modal")) $("img-modal").hidden = true; };
  $("btn-image-one").onclick = () => { const err = validate(); if (err) return toast(err); openImageShare([currentEntry()]); };
  $("btn-image-all").onclick = () => {
    const all = store.get("ttr_log", []).filter(e => e.date === state.date);
    if (all.length) openImageShare(all);
  };

  $("btn-clear-log").onclick = () => {
    store.set("ttr_log", store.get("ttr_log", []).filter(e => e.date !== state.date)); renderLog();
  };

  /* ---------- results (everyone's ratings for the selected day, read from the Sheet) ---------- */
  function resultFor(it) {
    if (!state.results) return null;
    const rows = state.results.filter(r => r.date === state.date && r.meal === state.meal && String(r.food).startsWith(it.en))
      .slice().sort((a, b) => String(b.ts).localeCompare(String(a.ts)));   // newest first
    if (!rows.length) return null;
    const good = rows.filter(r => r.rating === "Good").length;
    const avg = Math.round(rows.reduce((s, r) => s + (+r.score || 0), 0) / rows.length);
    return { n: rows.length, good, bad: rows.length - good, avg, rows };
  }
  async function loadResults() {
    const c = config(); if (!configReady(c) || !state.date) return;
    const date = state.date;
    try {
      const res = await fetch(`${c.apiUrl}?date=${encodeURIComponent(date)}`, { cache: "no-store" });
      const rows = await res.json();
      if (state.date !== date) return; // user moved to another day meanwhile
      state.results = Array.isArray(rows) ? rows : [];
      renderDishes(); renderFeed();
    } catch (err) { console.warn("results not loaded", err); }
  }

  /* ---------- settings ---------- */
  function openSettings() {
    const c = config(); const ok = configReady(c);
    $("cfg-status").className = "status " + (ok ? "ok" : "no");
    $("cfg-status").textContent = ok ? "Connected — ratings are shared with everyone." : "Not connected — ratings stay on this phone only.";
    $("cfg-api").value = c.apiUrl || "";
    $("modal").hidden = false;
  }
  $("btn-settings").onclick = openSettings;
  $("cfg-close").onclick = () => { $("modal").hidden = true; };
  $("modal").onclick = (e) => { if (e.target === $("modal")) $("modal").hidden = true; };
  $("cfg-save").onclick = () => {
    const url = $("cfg-api").value.trim();
    if (url && !configReady({ apiUrl: url })) return toast("That doesn't look like an Apps Script web app URL (…/exec).");
    store.set("ttr_cfg", url && url !== CONFIG.apiUrl ? { apiUrl: url } : {});
    $("modal").hidden = true;
    toast("Settings saved.");
    state.results = null; renderAll(); loadResults(); flushPending();
  };

  let toastTimer;
  function toast(msg) {
    let t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
  }

  /* ---------- install (PWA) ---------- */
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
  let installEvt = null;
  function showInstall(how) {
    if (standalone || store.get("ttr_install_dismissed", false)) return;
    $("install-how").innerHTML = how; $("install").hidden = false;
  }
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault(); installEvt = e;
    $("install-btn").hidden = false;
    showInstall("Get a home-screen icon and full-screen view.");
  });
  $("install-btn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; $("install").hidden = true; };
  $("install-x").onclick = () => { $("install").hidden = true; store.set("ttr_install_dismissed", true); };
  if (isIOS) showInstall("In Safari tap <kbd>Share</kbd> ⬆︎ then <kbd>Add to Home Screen</kbd>.");
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch((err) => console.warn("sw", err));
  }

  renderAll();
  loadResults();
  flushPending();
})();
</script>
