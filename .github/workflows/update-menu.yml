name: Update menu from PDF

# Drop a new weekly PDF into the menus/ folder (GitHub web upload, the Drive/Gmail bridge, or git push).
# This extracts it into menus/<start-date>.json, deletes the PDF from the repo, rebuilds index.html
# with the last weeks of menus and commits - GitHub Pages then redeploys the app.
on:
  push:
    paths:
      - "menus/*.pdf"
      - "menus/*.PDF"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor dependency
        run: pip install --quiet pdfplumber

      - name: Import waiting PDFs into the app (deletes them from menus/)
        run: python extract_menu.py --all menus

      - name: Commit food lists, remove PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A menus menu.json index.html
          if git diff --cached --quiet; then
            echo "Menu unchanged - nothing to commit."
            exit 0
          fi
          weeks=$(python -c "import json;w=json.load(open('menu.json',encoding='utf-8'))['weeks'];print(w[-1]['week'])")
          git commit -m "Menu update: ${weeks:-new week} (food list stored, PDF removed)"
          git push
